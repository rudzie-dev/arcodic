<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | ARCODIC</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      @font-face {
        font-family: 'Cal Sans';
        src: url('/fonts/cal-sans.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter-var.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --ink:   #101010;
        --paper: #F1EDE6;
        --red:   #D63408;
        --ui:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --logo:  'Cal Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --ease-spring: cubic-bezier(.34,1.2,.64,1);
        --ease-out:    cubic-bezier(.22,1,.36,1);
      }

      html, body {
        height: 100%;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100svh;
        padding: 24px;
        position: relative;
        overflow: hidden;
        text-align: center;
      }

      /* same ambient glow language as the hero/dock elsewhere on the site */
      body::before {
        content: ''; position: absolute; pointer-events: none;
        top: -10%; left: 50%; transform: translateX(-50%);
        width: 60vw; height: 60vw; max-width: 640px; max-height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(214,52,8,.35) 0%, transparent 70%);
        filter: blur(90px);
        animation: drift 22s var(--ease-spring) infinite alternate;
      }
      @keyframes drift {
        0%   { transform: translate(-50%, 0) scale(1); }
        50%  { transform: translate(-46%, 6%) scale(1.08); }
        100% { transform: translate(-54%, -4%) scale(0.96); }
      }
      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
      }

      .kicker {
        position: relative;
        font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
        color: rgba(255,255,255,.5);
        margin-bottom: 20px;
      }

      .code {
        position: relative;
        font-family: var(--logo);
        font-size: clamp(96px, 20vw, 220px);
        line-height: .9;
        color: #fff;
        letter-spacing: -.01em;
      }
      .code span { color: var(--red); }

      h1 {
        position: relative;
        font-family: var(--ui);
        font-size: clamp(22px, 3.2vw, 30px);
        font-weight: 500;
        margin-top: 20px;
        color: #fff;
      }

      p {
        position: relative;
        font-size: 16px; line-height: 1.65;
        color: rgba(255,255,255,.6);
        max-width: 380px;
        margin: 14px auto 36px;
      }

      .btns {
        position: relative;
        display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      }
      .btn {
        font-family: var(--ui); font-size: 14px; font-weight: 600;
        padding: 14px 28px; border-radius: 999px;
        text-decoration: none; display: inline-block;
        transition: background .22s ease, color .22s ease, transform .22s var(--ease-spring);
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: scale(.96) translateY(0); }

      .btn-primary { background: #fff; color: var(--ink); }
      .btn-primary:hover { background: var(--red); color: #fff; }

      .btn-ghost { background: rgba(255,255,255,.08); color: rgba(255,255,255,.75); }
      .btn-ghost:hover { background: rgba(255,255,255,.14); color: #fff; }
    </style>
  </head>
  <body>
    <p class="kicker">ARCODIC</p>
    <div class="code">4<span>0</span>4</div>
    <h1>This page didn't make it live.</h1>
    <p>Whatever you were looking for isn't here — the link's dead, moved, or never existed. Let's get you back on track.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Back to homepage</a>
      <a href="/#contact" class="btn btn-ghost">Start a project</a>
    </div>
  </body>
</html>
