<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARcodic — Digital Studio</title>
    <meta name="description" content="ARcodic is a digital studio building high-performance websites for brands that refuse to blend in. 24-hour sprint delivery." />

    <!-- Preconnect so DNS resolves before CSS requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — non-blocking, display=swap already in URL -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Syne:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Godber preload — browser fetches in parallel with HTML parse -->
    <link
      rel="preload"
      href="/fonts/godber.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
